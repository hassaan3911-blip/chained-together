<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chained Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0505; --panel:rgba(28,8,7,.93); --line:rgba(255,90,60,.28); --text:#f6e7e2; --muted:#c9a49b;
  --red:#e0281e; --redDark:#8e1209; --ember:#ff8a3d; --gold:#ffc35a;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1a0505; --panel:rgba(28,8,7,.93); --text:#f6e7e2; --muted:#c9a49b; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#1a0505; --panel:rgba(28,8,7,.93); --text:#f6e7e2; --muted:#c9a49b; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top: env(safe-area-inset-top, 0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Barlow","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;font-weight:700;color:var(--text);text-shadow:0 2px 6px rgba(0,0,0,.8)}
#time{top:calc(14px + env(safe-area-inset-top, 0px));left:18px;font-family:"Bebas Neue",sans-serif;font-size:34px;letter-spacing:.03em}
#height{top:calc(14px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);text-align:center;font-family:"Bebas Neue",sans-serif;font-size:30px;letter-spacing:.03em}
#heightBar{width:180px;height:5px;background:rgba(0,0,0,.45);border-radius:3px;margin-top:2px;overflow:hidden}
#heightFill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--ember))}
#team{top:calc(16px + env(safe-area-inset-top, 0px));right:18px;font-size:15px;text-align:right;line-height:1.5}
#team .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px}
#msg{top:26%;left:50%;transform:translateX(-50%);font-family:"Bebas Neue",sans-serif;font-size:46px;letter-spacing:.04em;opacity:0;transition:opacity .25s;white-space:nowrap}
#msg.show{opacity:1}
#overlay{position:fixed;inset:0;display:flex;flex-wrap:wrap;gap:18px;overflow:auto;padding:18px;z-index:5;
  background:radial-gradient(ellipse at 50% 100%, rgba(255,80,20,.25), rgba(20,2,2,.82) 70%)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 28px;max-width:480px;width:100%;margin:auto;
  overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.title{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:clamp(46px,11vw,72px);line-height:.88;margin:0 0 4px;letter-spacing:.02em;
  color:#fff;text-shadow:0 0 24px rgba(255,60,20,.7)}
.chainline{height:10px;margin:8px 0 14px;background:
  radial-gradient(ellipse 7px 4px at 7px 5px, transparent 3px, #8b8b8b 3.5px, #5a5a5a 5px, transparent 5.5px) 0 0/14px 10px repeat-x}
h2{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:40px;line-height:1;margin:0 0 12px;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 16px;font-size:16px;font-weight:500;line-height:1.45}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px;font-weight:600}
input[type=text]{width:100%;font:600 18px "Barlow",sans-serif;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin:0 0 16px;user-select:text;-webkit-user-select:text}
input[type=text]:focus{outline:2px solid var(--ember);outline-offset:1px}
.btn{display:block;width:100%;font:400 24px "Bebas Neue",sans-serif;letter-spacing:.05em;border:0;border-radius:10px;padding:11px 18px;margin:0 0 10px;
  cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--redDark)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--redDark)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text)}
.btn.small{display:inline-block;width:auto;font-size:18px;padding:6px 12px;margin:0}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center}
.row input{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin:0}
.code{font-family:"Bebas Neue",sans-serif;font-size:54px;letter-spacing:.18em;color:var(--gold);text-align:center;margin:4px 0 6px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;font-weight:600}
.slot .who{display:flex;align-items:center;gap:10px}
.slot .sw{width:14px;height:14px;border-radius:4px}
.tag{font-size:13px;color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-style:italic;font-weight:500}
.note{color:var(--muted);font-size:14px;margin:10px 0 0;line-height:1.45}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:"Bebas Neue",sans-serif;font-size:32px;font-weight:400;color:var(--gold);line-height:1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 16px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;color:var(--muted);margin:14px 0 0}
.keys kbd{font:700 13px "Barlow",sans-serif;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:1px 7px;white-space:nowrap}
#admin{position:fixed;left:16px;top:calc(64px + env(safe-area-inset-top, 0px));width:260px;z-index:6;background:var(--panel);border:1px solid var(--ember);
  border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:15px}
#admin .adm-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:.04em;color:var(--gold)}
#admin button{font:600 14px "Barlow",sans-serif;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
#admin button:hover{border-color:var(--ember)}
#admin button.on{background:var(--red);border-color:var(--red)}
#admin .tg{display:flex;align-items:center;gap:8px;margin:0 0 8px;color:var(--text);font-size:15px;cursor:pointer}
#admin .tg input{width:18px;height:18px;accent-color:var(--red)}
#admin .adm-row{display:flex;gap:6px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
#admin .adm-sub{color:var(--muted);font-weight:600;font-size:13px;margin:4px 0 6px}
#admin .adm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
#admin .wide{width:100%}
#admin .adm-hint{color:var(--muted);font-size:13px;margin:10px 0 0;line-height:1.4}
#overlay.soft{background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(10,40,20,.35))}
#overlay.soft .card{background:rgba(18,30,20,.88);border-color:rgba(160,255,170,.35)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%)}
#white{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.shot{display:block;width:100%;border-radius:12px;margin:0 0 14px;border:1px solid rgba(255,255,255,.25)}
#lbCard .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
#lbCard .tabs button{font:600 14px "Barlow",sans-serif;color:var(--text);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:8px 4px;cursor:pointer}
#lbCard .tabs button.on{background:var(--red);border-color:var(--red)}
#lbCard .tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
ol.lb{list-style:none;margin:0;padding:0}
ol.lb li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
ol.lb li .rk{font-family:"Bebas Neue",sans-serif;font-size:22px;color:var(--muted)}
ol.lb li:nth-child(1) .rk{color:var(--gold)}
ol.lb li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.lb li .tm{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.03em}
ol.lb li.me{background:rgba(224,40,30,.18);border-radius:8px}
.hidden{display:none !important}
.tc{position:fixed;z-index:3;display:none}
body.touch .tc{display:block}
#joyBase{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,200,180,.45);transform:translate(-50%,-50%);pointer-events:none;opacity:0}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,220,210,.7)}
.tbtn{border-radius:50%;background:rgba(40,8,6,.55);border:3px solid rgba(255,160,130,.7);color:#fff;font:400 20px "Bebas Neue",sans-serif;letter-spacing:.05em;align-items:center;justify-content:center}
body.touch .tbtn{display:flex}
#btnJump{right:calc(26px + env(safe-area-inset-right, 0px));bottom:calc(40px + env(safe-area-inset-bottom, 0px));width:86px;height:86px}
#btnRun{right:calc(124px + env(safe-area-inset-right, 0px));bottom:calc(30px + env(safe-area-inset-bottom, 0px));width:64px;height:64px}
#btnRun.on{background:rgba(224,40,30,.7)}
#btnPause{top:calc(70px + env(safe-area-inset-top, 0px));right:16px;width:44px;height:44px;font-size:18px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>
<div id="white"></div>
<div class="hud" id="time">0:00</div>
<div class="hud" id="height">0 m<div id="heightBar"><div id="heightFill"></div></div></div>
<div class="hud" id="team"></div>
<div class="hud" id="msg"></div>
<div class="tc" id="joyBase"><div id="joyKnob"></div></div>
<div class="tc tbtn" id="btnJump">Jump</div>
<div class="tc tbtn" id="btnRun">Run</div>
<div class="tc tbtn" id="btnPause">II</div>
<div id="overlay"><div class="card" id="card"></div>
  <div class="card hidden" id="lbCard">
    <h2>Leaderboard</h2>
    <p class="sub">Fastest escapes from the fire pit.</p>
    <div class="tabs"><button data-lb="1" class="on">Single</button><button data-lb="2">2 players</button><button data-lb="3">3 players</button></div>
    <div id="lbList"></div>
  </div>
</div>
<div id="admin" class="hidden">
  <div class="adm-head"><span>Admin panel</span><button data-adm="close" aria-label="Close admin panel">✕</button></div>
  <label class="tg"><input type="checkbox" id="admFly"> Fly mode</label>
  <label class="tg"><input type="checkbox" id="admClip" checked> Fly through walls</label>
  <label class="tg"><input type="checkbox" id="admClick" checked> Click anywhere to fly there</label>
  <div class="adm-sub">Fly speed</div>
  <div class="adm-row"><button data-adm="spd" data-v="8">Slow</button><button data-adm="spd" data-v="18" class="on">Normal</button><button data-adm="spd" data-v="40">Fast</button></div>
  <div class="adm-sub">Fly to</div>
  <div class="adm-grid" id="admGo"></div>
  <button data-adm="fires" class="wide">Light every fire</button>
  <p class="adm-hint">In fly mode: W A S D to move, Space to go up, Q to go down. Press Shift twice to close.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const V3=THREE.Vector3;
const isTouch=window.matchMedia && matchMedia('(pointer: coarse)').matches;
if(isTouch) document.body.classList.add('touch');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- storage ----------
function load(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let myName=load('ct-name','')||'';
let friends=load('ct-friends',[]);
let records=load('ct-records',{played:0, escapes:0, bestHeight:0, bestTime:{}, history:[]});

// ---------- renderer & scene ----------
const canvas=$('game');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const FOG=0x3a0906;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(FOG, 30, 190);
scene.background=new THREE.Color(FOG);
const camera=new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 900);
// glow for lava, fire and the gate (falls back to a plain render if the bloom scripts don't load)
let composer=null, renderPass=null, bloomPass=null;
try{
  if(THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass){
    const pr=Math.min(window.devicePixelRatio||1,2);
    let rt=null;
    if(renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget){ rt=new THREE.WebGLMultisampleRenderTarget(innerWidth*pr, innerHeight*pr, {format:THREE.RGBAFormat}); rt.samples=4; }
    composer=rt? new THREE.EffectComposer(renderer, rt) : new THREE.EffectComposer(renderer);
    composer.setPixelRatio && composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
    renderPass=new THREE.RenderPass(scene, camera); composer.addPass(renderPass);
    bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth/2, innerHeight/2), 0.5, 0.45, 0.7); composer.addPass(bloomPass);
  }
}catch(e){ composer=null; }

scene.add(new THREE.HemisphereLight(0xff8a6a, 0x1a0000, 0.55));
scene.add(new THREE.AmbientLight(0x401010, 0.5));
const sun=new THREE.DirectionalLight(0xffc0a0, 0.85);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:140});
sun.shadow.bias=-0.0008;
scene.add(sun); scene.add(sun.target);
const lavaLight=new THREE.PointLight(0xff4a10, 2.2, 70, 1.6); lavaLight.position.set(0,2,0); scene.add(lavaLight);
const rimLight=new THREE.DirectionalLight(0xff5a1e, 0.45); rimLight.position.set(-20,-30,-10); scene.add(rimLight);

// ---------- procedural textures ----------
function canvasTex(size, draw){
  const c=document.createElement('canvas'); c.width=c.height=size; draw(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;
}
function rockTex(base, crack){
  return canvasTex(256,(g,s)=>{
    g.fillStyle=base; g.fillRect(0,0,s,s);
    for(let i=0;i<1600;i++){
      const v=Math.floor(Math.random()*60);
      g.fillStyle=`rgba(${v+20},${v*0.6+10},${v*0.5+8},${Math.random()*0.35})`;
      const r=Math.random()*10+1; g.beginPath(); g.arc(Math.random()*s,Math.random()*s,r,0,Math.PI*2); g.fill();
    }
    for(let i=0;i<500;i++){ g.fillStyle=`rgba(255,220,200,${Math.random()*0.06})`; g.fillRect(Math.random()*s,Math.random()*s,2,2); }
    g.strokeStyle=crack; g.lineWidth=1.6;
    for(let i=0;i<9;i++){
      let x=Math.random()*s, y=Math.random()*s; g.beginPath(); g.moveTo(x,y);
      for(let j=0;j<7;j++){ x+=(Math.random()-0.5)*40; y+=(Math.random()-0.5)*40; g.lineTo(x,y); } g.stroke();
    }
  });
}
const rockSideTex=rockTex('#3b2420','rgba(255,90,30,0.35)');
const rockTopTex=rockTex('#4d3029','rgba(255,120,50,0.25)');
const lavaTex=canvasTex(256,(g,s)=>{
  g.fillStyle='#b81d05'; g.fillRect(0,0,s,s);
  for(let i=0;i<260;i++){
    const r=Math.random()*26+4; const x=Math.random()*s, y=Math.random()*s;
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, Math.random()<.5?'rgba(255,210,80,.9)':'rgba(255,120,20,.8)'); grd.addColorStop(1,'rgba(255,60,0,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  for(let i=0;i<40;i++){ g.fillStyle='rgba(40,5,0,.35)'; g.beginPath(); g.arc(Math.random()*s,Math.random()*s,Math.random()*14+3,0,Math.PI*2); g.fill(); }
});
lavaTex.repeat.set(40,40);
const skyTex=canvasTex(512,(g,s)=>{
  const grd=g.createLinearGradient(0,0,0,s);
  grd.addColorStop(0,'#120203'); grd.addColorStop(0.45,'#4a0b07'); grd.addColorStop(0.75,'#8f1d0b'); grd.addColorStop(1,'#ff5a1a');
  g.fillStyle=grd; g.fillRect(0,0,s,s);
  for(let i=0;i<70;i++){ g.fillStyle=`rgba(0,0,0,${Math.random()*0.18})`; g.beginPath(); g.ellipse(Math.random()*s, Math.random()*s*0.7, Math.random()*90+30, Math.random()*14+6, 0,0,Math.PI*2); g.fill(); }
});
skyTex.wrapS=THREE.RepeatWrapping; skyTex.wrapT=THREE.ClampToEdgeWrapping;

const rockSide=new THREE.MeshStandardMaterial({map:rockSideTex, bumpMap:rockSideTex, bumpScale:0.06, roughness:.95, flatShading:true});
const rockTop=new THREE.MeshStandardMaterial({map:rockTopTex, bumpMap:rockTopTex, bumpScale:0.05, roughness:.9, flatShading:true});
const rockGlowSide=new THREE.MeshStandardMaterial({map:rockSideTex, roughness:.9, flatShading:true, emissive:0x5a1200, emissiveIntensity:.8});
const crumbleMat=new THREE.MeshStandardMaterial({map:rockSideTex, roughness:.9, flatShading:true, emissive:0x8a2a00, emissiveIntensity:.5, transparent:true});
const metalMat=new THREE.MeshStandardMaterial({color:0x6b6b6e, metalness:.85, roughness:.35});

// ---------- seeded world ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rng=mulberry32(20261105);
function h3(x,y,z){ const s=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453; return s-Math.floor(s); }
function rockGeo(w,h,d){
  const g=new THREE.BoxGeometry(w,h,d,3,2,3), pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const n1=h3(x+w,y+h,z+d)-0.5, n2=h3(z+1.3,x+2.1,y+0.7)-0.5, n3=h3(y+3.3,z+5.1,x+1.9)-0.5;
    pos.setX(i, x+n1*0.4); pos.setZ(i, z+n2*0.4);
    if(y<h/2-1e-3){ const bottom=y<-h/2+1e-3; pos.setY(i, y+n3*0.4-(bottom?0.4+Math.abs(n3)*h*0.8:0)); }
  }
  g.computeVertexNormals(); return g;
}
const solids=[], movers=[], crumbles=[], cps=[];
function updateBox(o){ const p=o.mesh.position; o.box.min.set(p.x-o.w/2,p.y-o.h/2,p.z-o.d/2); o.box.max.set(p.x+o.w/2,p.y+o.h/2,p.z+o.d/2); }
function rock(x,z,w,d,top,thick,mats){
  const mesh=new THREE.Mesh(rockGeo(w,thick,d), mats||[rockSide,rockSide,rockTop,rockSide,rockSide,rockSide]);
  mesh.position.set(x, top-thick/2, z); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh);

function animateRig(r, dt, grounded, speed, sprint, t){
  const moving=grounded && speed>0.6;
  if(moving) r.phase+=dt*speed*1.5;
  r.swing+=((moving?Math.min(speed/7,1.35):0)-r.swing)*Math.min(1,dt*10);
  r.air+=((grounded?0:1)-r.air)*Math.min(1,dt*8);
  const sw=r.swing, g=1-r.air, ph=r.phase, amp=0.6*sw;
  const sL=Math.sin(ph), sR=Math.sin(ph+Math.PI);
  r.legL.hip.rotation.x= sL*amp*g + r.air*0.6;
  r.legR.hip.rotation.x= sR*amp*g + r.air*0.15;
  r.legL.kn.rotation.x=-(Math.max(0,Math.cos(ph))*1.05*sw+0.04)*g - r.air*1.0;
  r.legR.kn.rotation.x=-(Math.max(0,Math.cos(ph+Math.PI))*1.05*sw+0.04)*g - r.air*0.45;
  const breathe=Math.sin(t*1.9)*0.03*(1-sw)*g;
  let aLx=-sL*amp*0.85*g + r.air*0.8, aRx=-sR*amp*0.85*g + r.air*1.0;
  let aLz=-0.09-breathe-r.air*0.55, aRz=0.09+breathe+r.air*0.55;
  let eL=0.18+0.55*sw*g+r.air*0.4, eR=eL;
  if(r.cheer>0){ // both arms up after the escape
    const c=r.cheer, wave=Math.sin(t*7)*0.18;
    aLx+=(0.1-aLx)*c; aRx+=(0.1-aRx)*c; aLz+=(-2.65+wave-aLz)*c; aRz+=(2.65+wave-aRz)*c; eL+=(0.25-eL)*c; eR+=(0.25-eR)*c;
  }
  r.armL.sh.rotation.x=aLx; r.armR.sh.rotation.x=aRx; r.armL.sh.rotation.z=aLz; r.armR.sh.rotation.z=aRz;
  r.armL.el.rotation.x=eL; r.armR.el.rotation.x=eR;
  r.body.rotation.x=-(sprint?0.2:0.07)*sw;
  r.body.position.y=Math.abs(Math.cos(ph))*0.035*sw-0.02*sw;
  r.torso.scale.x=1+Math.sin(t*1.9)*0.012;
  r.head.rotation.x=0.05*sw; r.head.rotation.y=Math.sin(t*0.6)*0.08*(1-sw);
}

const tmpA=new V3(), tmpB=new V3(), tmpP=new V3(), tmpN=new V3();
function drawChain(set, a, b){
  const dist=a.distanceTo(b), sag=Math.min(1.8, Math.max(0.04,(CHAIN_L-dist)*0.5));

    const t=(i+0.5)/LINKS, t2=(i+1.5)/LINKS;

    tmpN.lerpVectors(a,b,t2); tmpN.y-=sag*4*t2*(1-t2);

let dbApi=null, downloadsApi=null, myUid=null, lbDocs=[], lbState='loading', lbTab=1, lbStarted=false;
function fmtLong(t){ const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1); }
function startLeaderboard(){
  if(lbStarted) return; lbStarted=true;
  if(!dbApi){ lbState='local'; renderLB(); return; }
  const timer=setTimeout(()=>{ if(lbState==='loading'){ lbState='slow'; renderLB(); } },10000);
  dbApi.collection('scores').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); lbState='ok'; } else if(lbState==='loading') lbState='slow';
    lbDocs=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id}, d.data()));

}
function renderLB(){
  const el=$('lbList'); if(!el) return;

  if(lbState==='local'){
    const list=load('ct-lb-local',[]).filter(r=>r.m===lbTab).sort((a,b)=>a.t-b.t).slice(0,10);
    const note='<p class="note">Times played on this device.</p>';
    if(!list.length){ el.innerHTML='<p class="sub">No escapes yet. Be the first one out!</p>'+note; return; }
    el.innerHTML='<ol class="lb">'+list.map((r,i)=>'<li><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(lbTab>1&&r.team&&r.team.length?r.team.join(' + '):r.n)+'</span><span class="tm">'+fmtLong(r.t)+'</span></li>').join('')+'</ol>'+note;
    return;
  }
  if(lbState==='loading'){ el.innerHTML='<p class="sub">Loading times…</p>'; return; }
  if(lbState==='error'){ el.innerHTML='<p class="sub">The leaderboard can’t be reached right now. Try opening the game again later.</p>'; return; }
  const k='b'+lbTab;
  let rows=lbDocs.filter(d=>d[k] && typeof d[k].t==='number').map(d=>({id:d.id, n:String(d.n||'Prisoner').slice(0,20), t:d[k].t, e:d[k].e,
    team:Array.isArray(d[k].team)?d[k].team.slice(0,3).map(x=>String(x).slice(0,20)):[]}));
  rows.sort((a,b)=>a.t-b.t);
  if(lbTab>1){ const seen=new Set(); rows=rows.filter(r=>{ const key=r.e?'e'+r.e:'u'+r.id; if(seen.has(key)) return false; seen.add(key); return true; }); }
  rows=rows.slice(0,10);
  const stale=lbState==='slow'?'<p class="note">These times may be out of date.</p>':'';
  if(!rows.length){ el.innerHTML='<p class="sub">No escapes yet. Be the first one out!</p>'+stale; return; }
  el.innerHTML='<ol class="lb">'+rows.map((r,i)=>'<li class="'+(r.id===myUid?'me':'')+'"><span class="rk">'+(i+1)+'</span><span class="nm">'+
    esc(lbTab>1&&r.team.length?r.team.join(' + '):r.n)+'</span><span class="tm">'+fmtLong(r.t)+'</span></li>').join('')+'</ol>'+stale;
}

// ---------- online play outside Claude (PeerJS) ----------
// When the game runs as a plain index.html, the host's browser becomes the room:
// friends connect straight to it with the room code, and the host shares everyone's
// position with everyone else. It offers the same peers()/presence()/onPeers()/leave()
// shape the game already uses, so nothing else in the game has to change.
const PEER_OK = typeof window.Peer==='function';
function onlineOK(){ return !!roomApi || PEER_OK; }
function peerRoom(code, asHost){
  return new Promise((resolve,reject)=>{
    const hostId='chained-together-067-'+code;
    const mine={}, others=new Map(), conns=new Map();
    let myId=null, hostConn=null, cbs=[], lost=null, done=false, timer=null;
    const notify=()=>cbs.forEach(f=>{ try{ f(); }catch(e){} });
    let peer;
    try{ peer = asHost ? new window.Peer(hostId) : new window.Peer(); }catch(e){ reject(e); return; }
    const fail=err=>{ if(done) return; done=true; clearInterval(timer); try{ peer.destroy(); }catch(e){} reject(err); };
    const api={
      presence(patch){
        for(const k in patch){ if(patch[k]===null||patch[k]===undefined) delete mine[k]; else mine[k]=patch[k]; }
        if(!asHost && hostConn && hostConn.open){ try{ hostConn.send({t:'p', p:mine}); }catch(e){} }
        return Promise.resolve();
      },
      peers(){
        const list=[{peer:myId||'me', isMe:true, sameTab:true, kind:'viewer', presence:mine}];
        for(const [id,pr] of others) list.push({peer:id, isMe:false, sameTab:false, kind:'viewer', presence:pr});
        return list;
      },
      onPeers(cb, onLost){ cbs.push(cb); lost=onLost||null; },
      leave(){ done=true; clearInterval(timer); try{ peer.destroy(); }catch(e){} return Promise.resolve(); }
    };
    peer.on('open', id=>{
      myId=id;
      if(asHost){
        peer.on('connection', c=>{
          c.on('open', ()=>{ conns.set(c.peer,c); });
          c.on('data', d=>{ if(d && d.t==='p' && d.p && typeof d.p==='object'){ others.set(c.peer, d.p); notify(); } });
          const gone=()=>{ conns.delete(c.peer); if(others.delete(c.peer)) notify(); };
          c.on('close', gone); c.on('error', gone);
        });
        // share everyone's state with everyone, 20 times a second
        timer=setInterval(()=>{
          const all={}; all[myId]=mine; for(const [k,v] of others) all[k]=v;
          for(const c of conns.values()) if(c.open){ try{ c.send({t:'all', all}); }catch(e){} }
        },50);
        done=true; resolve(api);
      } else {
        hostConn=peer.connect(hostId,{serialization:'json'});
        const to=setTimeout(()=>fail(new Error('no host')),10000);
        hostConn.on('open', ()=>{ clearTimeout(to); done=true; resolve(api); });
        hostConn.on('data', d=>{
          if(!d || d.t!=='all' || !d.all) return;
          others.clear();
          for(const k of Object.keys(d.all)) if(k!==myId && d.all[k] && typeof d.all[k]==='object') others.set(k, d.all[k]);
          notify();
        });
        hostConn.on('close', ()=>{ if(lost) lost(new Error('host left')); });
      }
    });
    peer.on('error', e=>{ if(!done) fail(e); else if(!asHost && e && e.type==='network' && lost) lost(e); });
    peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
  });
}
async function joinRoom(code, asHost){
  if(!onlineOK()) return;
  try{
    net = roomApi ? await roomApi.join('ct-'+code) : await peerRoom(code, asHost);
    roomCode=code; myJoin=Date.now(); epoch=0;
    await net.presence({n:myName.slice(0,20), j:myJoin, m:asHost?mode:null, go:0, lob:1});

}
async function leaveRoom(){

let netTimer=0;
function sendNet(dt){
  if(!net) return; netTimer-=dt; if(netTimer>0) return; netTimer=0.05;
  const r2=v=>Math.round(v*100)/100;
  net.presence({n:myName.slice(0,20), j:myJoin, p:[r2(P.pos.x),r2(P.pos.y),r2(P.pos.z)], f:r2(faceYaw), g:P.onGround?1:0,

}
function syncRemotes(dt){
  if(!net) return;
  const team=teamPeers().slice(0,roomMode()); const seen=new Set();
  team.forEach((p,idx)=>{
    if(p.isMe&&p.sameTab) return;
    const pr=p.presence; if(!Array.isArray(pr.p)) return;
    seen.add(p.peer);
    let r=remotes.get(p.peer);
    if(!r){
      r={rig:makePrisoner(idx), pos:new V3(pr.p[0],pr.p[1],pr.p[2]), target:new V3(), name:'', tag:null, slot:idx};
      remotes.set(p.peer,r);
    }
    const nm=String(pr.n||'Prisoner').slice(0,20);
    if(nm!==r.name || r.slot!==idx){ if(r.tag) r.rig.hero.remove(r.tag); r.name=nm; r.slot=idx; r.tag=nameTag(nm, SUIT_CSS[idx%3]); r.tag.position.y=2.3; r.rig.hero.add(r.tag); }
    r.target.set(+pr.p[0]||0,+pr.p[1]||0,+pr.p[2]||0);
    if(r.pos.distanceTo(r.target)>8) r.pos.copy(r.target);
    r.pos.lerp(r.target, 1-Math.exp(-dt*14));
    r.grounded=!!pr.g; r.speed=+pr.s||0; r.cp=pr.cp|0; r.h=pr.h|0; r.w=pr.w|0;
    r.rig.hero.position.copy(r.pos); r.rig.hero.rotation.y=+pr.f||0;
  });
  for(const [k,r] of remotes){ if(!seen.has(k)){ scene.remove(r.rig.hero); remotes.delete(k); } }
}
function chainOrder(){
  // everyone on the team in join order, as positions
  if(!net) return [{me:true, pos:P.pos, grounded:P.onGround}];
  const team=teamPeers().slice(0,roomMode()); const out=[];
  for(const p of team){
    if(p.isMe&&p.sameTab) out.push({me:true, pos:P.pos, grounded:P.onGround});
    else { const r=remotes.get(p.peer); if(r) out.push({me:false, pos:r.pos, grounded:r.grounded, r}); }
  }
  return out;
}

// ---------- simulation ----------
let chainSoundCd=0, worldT=0;
function moveMover(m,dt,carry){
  const ax=m.axis||'x', old=m.mesh.position[ax]; m.t+=dt;
  m.mesh.position[ax]=m.base[ax]+Math.sin(m.t*m.speed)*m.range; updateBox(m);
  if(carry && P.onGround && P.ground===m) P.pos[ax]+=m.mesh.position[ax]-old;
}
function animateHazards(dt){
  worldT+=dt;
  for(const sp of spinners) sp.g.rotation.y=worldT*sp.speed+sp.phase;
  for(const v of vents){
    const c=(worldT+v.off)%3.4; v.active=c>2.2; const warn=c>1.8 && !v.active;
    v.flame.visible=v.active||warn;
    const sc=v.active?1+Math.sin(worldT*30)*0.08:0.25;
    v.flame.scale.set(v.active?1:0.6, sc, v.active?1:0.6);
  }
}
function update(dt){
  runTime+=dt;
  for(const m of movers) moveMover(m,dt,true);
  for(const c of crumbles){
    if(c.phase==='solid' && P.onGround && P.ground===c){ c.phase='shake'; c.timer=0.8; sfx.crack(); }
    else if(c.phase==='shake'){ c.timer-=dt; c.mesh.position.x=c.base.x+Math.sin(c.timer*70)*0.05; if(c.timer<=0){ c.phase='fall'; c.timer=3.5; c.off=true; c.mesh.userData.off=true; } }
    else if(c.phase==='fall'){ c.timer-=dt; c.mesh.position.y-=dt*12; if(c.timer<=0){ c.phase='solid'; c.off=false; c.mesh.userData.off=false; c.mesh.position.copy(c.base); } }
  }
  P.jumpBuffer-=dt; P.coyote-=dt;
  if(admin.fly || admin.target){ adminFly(dt); return; }
  if(P.onGround) P.coyote=0.12;
  const wish=wishDir(), sprint=keys.ShiftLeft||keys.ShiftRight||runToggle, speed=sprint?RUN:WALK;
  const accel=(P.onGround?55:14)*dt;
  if(P.onGround || wish.lengthSq()>0.01){
    for(const a of ['x','z']){ const diff=wish[a]*speed-P.vel[a]; P.vel[a]+=Math.max(-accel,Math.min(accel,diff)); }
  }
  if(P.jumpBuffer>0 && P.coyote>0){ P.vel.y=JUMP; P.coyote=0; P.jumpBuffer=0; sfx.jump(); }
  P.vel.y-=(P.vel.y<0?G*1.3:G)*dt; if(P.vel.y<-45) P.vel.y=-45;
  const wasG=P.onGround, vy=P.vel.y;
  P.onGround=false; P.ground=null;
  moveAxis('x',P.vel.x*dt); moveAxis('z',P.vel.z*dt); moveAxis('y',P.vel.y*dt);
  if(!wasG && P.onGround && vy<-9){ landDip=Math.min(0.35,-vy*0.012); sfx.land(); }

  // the chain: pull toward whoever you're chained to
  const order=chainOrder(); const mi=order.findIndex(o=>o.me);
  let taut=false;
  for(const ni of [mi-1, mi+1]){
    const n=order[ni]; if(!n) continue;
    tmpA.set(P.pos.x,P.pos.y+0.9,P.pos.z); tmpB.set(n.pos.x,n.pos.y+0.9,n.pos.z);
    const d=tmpA.sub(tmpB), dist=d.length();
    if(dist>CHAIN_L){
      taut=true; d.divideScalar(dist);
      let k=0.5; if(!P.onGround && n.grounded) k=1; else if(P.onGround && !n.grounded) k=0.18;
      const corr=Math.min(1.2,(dist-CHAIN_L)*k);
      moveAxis('x',-d.x*corr); moveAxis('z',-d.z*corr); moveAxis('y',-d.y*corr);
      const vd=P.vel.dot(d); if(vd>0) P.vel.addScaledVector(d,-vd);
    }
  }
  chainSoundCd-=dt; if(taut && chainSoundCd<=0){ sfx.chain(); chainSoundCd=0.6; }

  // hazards: spinning fire bars and fire vents
  for(const sp of spinners){
    if(P.pos.y>sp.top+1.0 || P.pos.y<sp.top-0.3) continue;
    const a=sp.g.rotation.y, ux=Math.cos(a), uz=-Math.sin(a), px=P.pos.x-sp.x, pz=P.pos.z-sp.z;
    const pr=Math.max(-sp.half,Math.min(sp.half,px*ux+pz*uz));
    if(Math.hypot(px-ux*pr,pz-uz*pr)<R+0.17){ die('Burned!'); return; }
  }
  for(const v of vents){
    if(v.active && Math.hypot(P.pos.x-v.x,P.pos.z-v.z)<0.95 && P.pos.y>=v.top-0.1 && P.pos.y<v.top+2.6){ die('Burned!'); return; }
  }
  // checkpoints
  for(let i=1;i<cps.length;i++){
    if(i>P.cp && P.onGround && P.pos.distanceTo(cps[i].spawn)<4.5){ P.cp=i; showMsg('Checkpoint!', '#ffc35a'); sfx.fire(); }
  }
  P.maxH=Math.max(P.maxH, P.pos.y);
  const cpY=cps[teamCp()].spawn.y;
  if(P.pos.y<-2.5 || P.pos.y<cpY-22) die();
  setPBox();
  if(pbox.intersectsBox(summitBox)) winRun();
  for(const r of remotes.values()){ if(r.w && r.w===epoch) winRun(); }
}

// ---------- main loop ----------
const ray=new THREE.Raycaster(), pivot=new V3(), camDir=new V3();
let last=performance.now(), fov=68;
function frame(now){
  const dt=Math.min((now-last)/1000,1/30); last=now; const t=now/1000;
  animateHazards(dt);
  if(state==='playing'||state==='paused'){ if(state==='playing') update(dt); else runTime+=dt; }
  if(state==='ending') tickEnding(dt,t);
  $('lbCard').classList.toggle('hidden', state!=='menu');
  if(net && (state==='playing'||state==='paused'||state==='won'||state==='ending')){
    sendNet(dt); syncRemotes(dt);
    const h=hostPeer();
    if(h && !(h.isMe&&h.sameTab) && h.presence.go && h.presence.go!==epoch && (state==='won'||state==='playing')) startRun(h.presence.go);
  }
  if(net && state==='lobby'){ const h=hostPeer(); if(h && !(h.isMe&&h.sameTab) && h.presence.go && h.presence.go!==epoch) { mode=roomMode(); startRun(h.presence.go); } }

  if(state!=='playing') for(const m of movers) moveMover(m,dt*0.4,false);
  lavaTex.offset.x=t*0.01; lavaTex.offset.y=t*0.006; lavaMat.emissiveIntensity=0.85+Math.sin(t*1.3)*0.15;
  lavaLight.intensity=2+Math.sin(t*3.1)*0.3;
  for(const d of debris){ d.userData.a+=d.userData.sp*dt; d.position.x=Math.cos(d.userData.a)*d.userData.r; d.position.z=Math.sin(d.userData.a)*d.userData.r; d.rotation.y+=d.userData.spin*dt; }
  const tc=teamCp();
  cps.forEach((c,i)=>{ const lit=i<=tc && state!=='menu'; c.b.fire.visible=lit; c.b.light.intensity=lit?2.2+Math.sin(t*12+i)*0.5:0; if(lit){ c.b.fire.scale.set(1,1+Math.sin(t*15+i)*0.15,1); c.b.fire.rotation.y=t*2; } });

  // embers drift up around the camera
  for(let i=0;i<EMBERS;i++){
    emberPos[i*3+1]+=emberVel[i]*dt; emberPos[i*3]+=Math.sin(t+i)*0.01;
    if(emberPos[i*3+1]>camera.position.y+30){ emberPos[i*3]=camera.position.x+(Math.random()-0.5)*80; emberPos[i*3+1]=camera.position.y-25; emberPos[i*3+2]=camera.position.z+(Math.random()-0.5)*80; }
  }
  emberGeo.attributes.position.needsUpdate=true;
  for(const sp of smoke){ sp.position.y+=sp.userData.v*dt; if(sp.position.y>camera.position.y+35){ sp.position.set(camera.position.x+(Math.random()-0.5)*90, camera.position.y-30, camera.position.z+(Math.random()-0.5)*90); } }

  const inGame=me && (state==='playing'||state==='paused'||state==='won'||state==='ending');
  if(inGame && inHeaven){
    // the escape shot: camera circles slowly in front of the prisoners in the green field
    animateRig(me, dt, true, 0, false, t);
    let k=0; for(const r of remotes.values()){ const sx=(k%2?1:-1)*(1.25+Math.floor(k/2)*1.1); r.rig.hero.position.set(sx,0,0.55); r.rig.hero.rotation.y=0; animateRig(r.rig, dt, true, 0, false, t); k++; }
    const a=0.35+Math.sin(t*0.25)*0.25, dist=remotes.size?5.4:4.2;
    camera.position.set(Math.sin(a)*dist, 1.45, -Math.cos(a)*dist); camera.lookAt(0,1.1,0);
    if(camera.fov!==55){ camera.fov=55; camera.updateProjectionMatrix(); }
    $('time').textContent=''; $('height').firstChild.nodeValue=''; $('team').innerHTML='';
  } else if(inGame){
    const hs=Math.hypot(P.vel.x,P.vel.z), sprint=keys.ShiftLeft||keys.ShiftRight||runToggle;
    if(hs>0.6 && (state==='playing'||state==='ending')){ const target=Math.atan2(-P.vel.x,-P.vel.z); let d=((target-faceYaw+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; faceYaw+=d*Math.min(1,dt*12); }
    me.hero.position.copy(P.pos); me.hero.rotation.y=faceYaw;
    animateRig(me, dt, P.onGround, hs, sprint, t);
    for(const r of remotes.values()) animateRig(r.rig, dt, r.grounded, r.speed, r.speed>WALK+0.5, t);
    // chains
    const order=chainOrder(); hideChains();
    for(let i=0;i<order.length-1 && i<2;i++){
      tmpA.set(order[i].pos.x,order[i].pos.y+0.86,order[i].pos.z); tmpB.set(order[i+1].pos.x,order[i+1].pos.y+0.86,order[i+1].pos.z);
      drawChain(chainSets[i], tmpA.clone(), tmpB.clone());
    }
    landDip*=Math.max(0,1-dt*7);
    pivot.set(P.pos.x,P.pos.y+1.55,P.pos.z);
    camDir.set(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch));
    ray.set(pivot,camDir); ray.far=wantDist;
    const hits=ray.intersectObjects(solidMeshes,true).filter(h=>!h.object.userData.off);
    const target=hits.length?Math.max(1.0,hits[0].distance-0.35):wantDist;
    camDist= target<camDist?target:camDist+(target-camDist)*Math.min(1,dt*4);
    camera.position.copy(pivot).addScaledVector(camDir,camDist); camera.position.y-=landDip*0.3;
    camera.lookAt(pivot.x,pivot.y+0.25,pivot.z);
    me.hero.visible=camDist>1.2 || inHeaven;
    const tf=68+Math.min(Math.max(hs-WALK,0),6)*1.4; fov+=(tf-fov)*Math.min(1,dt*6);
    if(Math.abs(camera.fov-fov)>0.01){ camera.fov=fov; camera.updateProjectionMatrix(); }
    sun.position.set(P.pos.x+25,P.pos.y+50,P.pos.z+15); sun.target.position.copy(P.pos);
    lavaLight.position.set(P.pos.x,-2,P.pos.z);
    // HUD
    $('time').textContent=fmt(runTime);
    const hNow=Math.max(0,Math.round(P.pos.y));
    $('height').firstChild.nodeValue=hNow+' m of '+Math.round(SUMMIT.y)+' m';
    $('heightFill').style.width=Math.min(100,hNow/SUMMIT.y*100)+'%';
    let teamHtml='<div>'+esc(myName||'You')+' · '+hNow+' m<span class="dot" style="background:'+SUIT_CSS[(me.slot||0)%3]+'"></span></div>';
    for(const r of remotes.values()) teamHtml+='<div>'+esc(r.name)+' · '+Math.max(0,Math.round(r.pos.y))+' m<span class="dot" style="background:'+SUIT_CSS[r.slot%3]+'"></span></div>';
    $('team').innerHTML=teamHtml;
  } else {
    // slow orbit for the menu backdrop
    const a=t*0.05; camera.position.set(Math.sin(a)*42, 18+Math.sin(t*0.2)*4, Math.cos(a)*42); camera.lookAt(0,22,0);
    sun.position.set(25,80,15); sun.target.position.set(0,20,0);
    $('time').textContent=''; $('height').firstChild.nodeValue=''; $('team').innerHTML='';
  }
  document.querySelectorAll('.hud#heightBar').forEach(()=>{});
  $('heightBar').style.visibility=inGame?'visible':'hidden';
  if(msgTimer>0){ msgTimer-=dt; if(msgTimer<=0) msgEl.classList.remove('show'); }
  sky.position.copy(camera.position);
  if(!inHeaven){ sky.position.copy(camera.position); }
  if(composer) composer.render(); else renderer.render(inHeaven?heaven:scene,camera);
  if(shotPending){
    shotPending=false;
    try{ shotURL=canvas.toDataURL('image/jpeg',0.9); }catch(e){ shotURL=''; }
    endPhase='done'; showWinCard();
  }
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });
})();
</script>
</body>
</html>
